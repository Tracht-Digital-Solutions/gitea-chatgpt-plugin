services:
  mcp:
    image: gitea-chatgpt-plugin:local
    build: .
    init: true
    stop_grace_period: 15s
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: '3000'
    restart: unless-stopped
    env_file: ${GITEA_ENV_FILE:-.env}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - gitea-mcp-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  gitea-mcp-data:
