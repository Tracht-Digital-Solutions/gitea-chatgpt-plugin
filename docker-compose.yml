services:
  mcp:
    image: ghcr.io/tracht-digital-solutions/gitea-chatgpt-plugin:v${GITEA_MCP_VERSION:?Set GITEA_MCP_VERSION from .env.example}
    init: true
    stop_grace_period: 15s
    pids_limit: 128
    environment:
      NODE_ENV: production
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - gitea-mcp-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  gitea-mcp-data:
